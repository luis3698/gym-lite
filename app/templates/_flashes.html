{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flashes">
      {% for category, message in messages %}
        <div class="flash {{ category if category in ('success', 'error', 'warning') else 'info' }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
