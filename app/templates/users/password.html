{% extends "base.html" %}
{% block title %}Cambiar contraseña — GymManager Lite{% endblock %}

{% block content %}
<div class="stack">
  <div class="row between">
    <h1>Cambiar contraseña</h1>
    <a class="btn btn-secondary" href="{{ url_for('users.profile') }}">← Volver al perfil</a>
  </div>

  <form class="card stack" method="post" style="max-width:460px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label class="field"><span>Contraseña actual</span>
      <input type="password" name="current_password" autocomplete="current-password" required></label>
    <label class="field"><span>Confirmar contraseña actual</span>
      <input type="password" name="current_password_confirm" autocomplete="current-password" required></label>

    <div style="border-top:1px solid var(--slate-200);padding-top:.9rem">
      <label class="field"><span>Nueva contraseña</span>
        <input type="password" name="new_password" autocomplete="new-password" required></label>
    </div>
    <label class="field"><span>Confirmar nueva contraseña</span>
      <input type="password" name="new_password_confirm" autocomplete="new-password" required></label>

    <p class="tiny muted" style="margin:0">{{ PASSWORD_POLICY_TEXT }}</p>
    <div><button class="btn btn-primary">Actualizar contraseña</button></div>
  </form>
</div>
{% endblock %}
